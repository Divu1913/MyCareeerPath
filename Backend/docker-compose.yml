version: '3.8'

services:
  api:
    build: .
    container_name: fastapi_mongodb_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=FastAPI MongoDB Backend
      - SECRET_KEY=super-secret-jwt-key-change-in-production-min-32-chars-long
      - MONGODB_URL=mongodb://root:example@mongodb:27017
      - DATABASE_NAME=fastapi_db
    depends_on:
      - mongodb
    volumes:
      - ./app:/app/app

  mongodb:
    image: mongo:7.0
    container_name: mongodb_service
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=fastapi_db
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express_ui
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=example
      - ME_CONFIG_MONGODB_URL=mongodb://root:example@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    depends_on:
      - mongodb

volumes:
  mongo_data:
